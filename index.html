		<!-- Structured Data: WebApplication Schema -->
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "WebApplication",
			"name": "Online Clipboard",
			"alternateName": ["Text Clipboard", "Text Sharing Tool", "Online Text Sharing"],
			"url": "https://clipboard.anikesh.dev/",
			"description": "Fast and secure online clipboard and text sharing platform. Paste text online, create self-destructing links, and share or retrieve text with a 4-character code.",
			"applicationCategory": "UtilityApplication",
			"operatingSystem": "All",
			"offers": {
				"@type": "Offer",
				"price": "0",
				"priceCurrency": "USD"
			},
			"featureList": [
				"Online Clipboard for text and code",
				"Temporary self-destructing text sharing",
				"4-character short code access",
				"Cloudflare Turnstile bot protection",
				"No login or registration required"
			]
		}
		</script>

		<!-- Structured Data: FAQPage Schema -->
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "FAQPage",
			"mainEntity": [
				{
					"@type": "Question",
					"name": "What is an online clipboard?",
					"acceptedAnswer": {
						"@type": "Answer",
						"text": "An online clipboard is a web tool that allows you to easily copy, paste, and share text, notes, and code snippets across different devices and browsers without needing an account or third-party messaging apps."
					}
				},
				{
					"@type": "Question",
					"name": "How does text sharing work on Online Clipboard?",
					"acceptedAnswer": {
						"@type": "Answer",
						"text": "Simply paste your text into the clipboard, complete the Turnstile verification, and click 'Create Link'. You will receive a unique short link and a 4-character code that can be shared with anyone."
					}
				},
				{
					"@type": "Question",
					"name": "How do I access someone's shared text clipboard?",
					"acceptedAnswer": {
						"@type": "Answer",
						"text": "Switch to the 'Access Text' tab, enter the 4-character code shared with you, complete the captcha, and click 'Access Text' to immediately view the shared text."
					}
				},
				{
					"@type": "Question",
					"name": "How long does text stay on this text clipboard?",
					"acceptedAnswer": {
						"@type": "Answer",
						"text": "All shared text automatically expires and is permanently deleted after 1 hour, ensuring your temporary notes and snippets remain private."
					}
				}
			]
		}
		</script>
